name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/hugueninfer/ledgerlight-api
  WEB_IMAGE: ghcr.io/hugueninfer/ledgerlight-web

jobs:
  build:
    # Only for a push to main in this repo whose CI succeeded. workflow_run also fires for fork
    # pull requests (branches matches the PR's head branch name), so check event, repo and branch.
    # Manual runs are limited to main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    # Native arm64 runner: proves the images build for the Oracle Ampere VM.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    # Secrets are not available in `if:` expressions, so the secret is mapped into an
    # env var and tested in a step; the deploy job reads the result from these outputs.
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      deploy: ${{ steps.vars.outputs.deploy }}
    steps:
      - id: vars
        run: |
          echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
          if [ -n "$DEPLOY_HOST" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; else echo "deploy=false" >> "$GITHUB_OUTPUT"; fi

      # The commit CI tested, not whatever main points at now.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          target: prod
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: build
    # Skipped (not failed) until the DEPLOY_HOST secret exists.
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      # Fail closed: an empty fingerprint would silently disable SSH host-key verification.
      - name: Require host key fingerprint and valid sha
        env:
          FP: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          test -n "$FP" || { echo "::error::DEPLOY_HOST_FINGERPRINT is required"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::build sha is not 40 hex chars"; exit 1; }

      - name: Deploy over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          TAG: ${{ needs.build.outputs.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          script_stop: true
          envs: TAG
          script: TAG="$TAG" /opt/ledgerlight/scripts/deploy.sh
